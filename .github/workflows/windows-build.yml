name: Windows build and validation
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native tests and WPF render checks
        shell: pwsh
        run: ./tools/Test-Windows.ps1
      - name: Publish self-contained executables
        shell: pwsh
        run: ./tools/Build.ps1
      - name: Retain build and test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectLauncher-windows
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/test-reports/
